<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0e14">
<title>보탐봇 미니 팝업</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#0b0e14;--panel:#151b26;--line:#303b4d;--text:#edf2fa;--muted:#9ba9bd;--gold:#e6bd68;--green:#63d69b;--red:#ff6262}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;font-size:7px}
main{padding:6px;max-width:520px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px}
.brand{font-weight:900;color:var(--gold);font-size:9px}
.sub{font-size:5px;color:var(--muted)}
button,input{font:inherit}
button{border:1px solid var(--line);border-radius:8px;background:#263448;color:var(--text);padding:6px 7px;font-weight:800;cursor:pointer}
button:disabled{opacity:.45}
.primary{background:#8a672d;border-color:#b58b43}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;margin-bottom:6px}
.status{font-size:6px;color:var(--muted);margin:4px 0 8px;min-height:15px}
.search{width:100%;padding:6px;border:1px solid var(--line);border-radius:8px;background:#0d131d;color:var(--text);margin-bottom:7px}
.bosslist{display:grid;gap:3px;max-height:68vh;overflow:auto}
.bosslist-toggle{width:100%;margin:0 0 5px;padding:5px;font-size:7px}
.boss-row{display:flex;align-items:center;gap:4px;width:100%;min-width:0;padding:4px 5px;border:1px solid var(--line);border-radius:7px;background:#151b26}
.boss-main{display:flex;align-items:center;justify-content:space-between;gap:4px;flex:1;min-width:0;padding:3px 2px;border:0;background:transparent;text-align:left}
.bossname{font-weight:850;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--gold)}
.time{font-weight:900;color:var(--green);white-space:nowrap;flex-shrink:0}
.time.soon{color:#f5d45e}.time.hot{color:#ff963e}.time.spawn{color:var(--red)}
.row-entry{display:flex;align-items:center;gap:3px;flex-shrink:0}
.row-entry input{width:43px;min-width:0;padding:5px 3px;border:1px solid var(--line);border-radius:5px;background:#0d131d;color:var(--text);font-size:7px;text-align:center}
.row-entry button{padding:5px 6px;font-size:7px;border-radius:5px}
.row-entry button:disabled,.boss-main:disabled{opacity:.45}
.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:12px;background:#000b}
.modal.show{display:flex}.modal-box{width:min(100%,360px);padding:10px;border:1px solid var(--line);border-radius:11px;background:var(--panel);box-shadow:0 12px 40px #000b}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:900;color:var(--gold);font-size:9px}
.modal-card{display:flex;align-items:center;gap:4px;width:100%;padding:7px;border:1px solid var(--line);border-radius:7px;background:#151b26}
.modal-card .boss-main{cursor:default}.modal-card .row-entry input{width:68px;font-size:9px}.modal-card .row-entry button{font-size:9px;padding:6px 9px}
.muted{color:var(--muted);font-size:6px}
.foot{display:flex;gap:5px;margin-top:6px}
.foot button{flex:1;font-size:6px}
#loginBox{display:none}
#message{white-space:pre-wrap;line-height:1.4;color:#f5d45e}
@media(max-height:520px){main{padding:5px}.panel{padding:6px;margin-bottom:5px}.bosslist{max-height:64vh}}
</style>
</head>
<body>
<main>
<header>
  <div class="status" id="status" style="margin:0;min-height:0">접속 중...</div>
 <div style="display:flex;gap:5px;align-items:center">
  <button id="goMainBtn" type="button" class="primary">🏠 메인화면</button>
  <button id="refreshBtn" type="button">새로고침</button>
 </div>
</header>
<div class="panel" id="loginBox">
 <b>로그인이 필요합니다</b>
 <div class="status">기존 보탐봇과 같은 브라우저에서 먼저 로그인해 주세요.</div>
 <button class="primary" id="openMainBtn" type="button" style="width:100%">기존 보탐봇 열기</button>
</div>
<div id="app" style="display:none">
 <div class="panel">
  <input class="search" id="search" type="search" placeholder="보스 이름 또는 별명 검색">
  <div class="bosslist" id="bossList"></div>
  <button class="bosslist-toggle" id="bossListToggle" type="button" style="display:none">전체 보스 펼치기</button>
 </div>
 </div>
 <div class="modal" id="bossModal" role="dialog" aria-modal="true" aria-label="보스 컷 등록"><div class="modal-box"><div class="modal-head"><span id="modalBossTitle">보스 컷 등록</span><button type="button" id="closeBossModal">닫기</button></div><div class="modal-card"><div class="boss-main"><span class="bossname" id="modalBossName"></span><span class="time" id="modalBossTime"></span></div><div class="row-entry"><input id="modalBossInput" type="search" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-form-type="other" maxlength="5" aria-label="컷 시간"><button class="primary" type="button" id="modalBossRegister">등록</button></div></div></div></div>
<div id="message"></div>
</main>
<script>
const SUPABASE_URL="https://jswekbrsjkylrwhgvvre.supabase.co";
const SUPABASE_KEY="sb_publishable_s4gO0UlJvICe6eQSzFA9MQ_RWxo02po";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null,profile=null,bosses=[],cuts=[],serverId=1,busy=false,channel=null,selectedPopupBossId=null,showAllBosses=false;
const $=id=>document.getElementById(id);
const say=t=>{$("message").textContent=t||""};
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function variants(b){const a=Array.isArray(b.aliases)?b.aliases:String(b.aliases||"").split(/[,;\/、\n]+/);return [b.name,...a].map(x=>String(x||"").trim()).filter(Boolean);}
function latestCut(b){const reset=b.timer_reset_at?new Date(b.timer_reset_at).getTime():0;return cuts.filter(c=>String(c.boss_id)===String(b.id)&&Number(c.server_id)===serverId&&new Date(c.cut_at).getTime()>reset&&!c.pending_delete_at).sort((a,b)=>new Date(b.cut_at)-new Date(a.cut_at))[0]||null;}
function nextAt(b){const last=latestCut(b);let base=last?new Date(last.cut_at).getTime():b.initial_spawn_at?new Date(b.initial_spawn_at).getTime():NaN;if(!Number.isFinite(base))return null;const interval=Number(b.respawn_hours)*3600000;if(!Number.isFinite(interval)||interval<=0)return null;let next=base+interval;const now=Date.now();while(next<now-300000)next+=interval;return next;}
function duration(ms){if(ms<=0)return "출현";let sec=Math.floor(ms/1000),d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60),s=sec%60;if(d)return d+"일 "+h+"시간 "+m+"분";if(h)return h+"시간 "+m+"분 "+s+"초";return m+"분 "+s+"초";}
function state(b){const at=nextAt(b);if(at===null)return {label:"시간 미등록",cls:""};const ms=at-Date.now();if(ms<=0&&ms>=-300000)return {label:"출현",cls:"spawn"};if(ms>0&&ms<=600000)return {label:duration(ms),cls:"hot"};if(ms>0&&ms<=3600000)return {label:duration(ms),cls:"soon"};return {label:ms>0?duration(ms):"다음 주기",cls:""};}
function sorted(){return [...bosses].sort((a,b)=>(nextAt(a)??Infinity)-(nextAt(b)??Infinity));}
function render(){
 const q=$("search").value.trim().toLocaleLowerCase();
 const saved={};document.querySelectorAll("[data-time-for]").forEach(x=>saved[x.dataset.timeFor]=x.value);
 const list=sorted().filter(b=>variants(b).some(n=>n.toLocaleLowerCase().includes(q)));
 const visibleList=showAllBosses?list:list.slice(0,3);
 const toggle=$("bossListToggle");
 toggle.style.display=list.length>3?"block":"none";
 toggle.textContent=showAllBosses?"접기":"전체 보스 펼치기 ("+list.length+"마리)";
 // 입력 중인 보스 시간 입력창은 DOM에서 교체하지 않습니다.
 // 매초 render() 및 15초 데이터 갱신이 실행되어도 모바일 키보드와 포커스를 유지합니다.
 const activeElement=document.activeElement;
 const isTypingBossTime=activeElement?.matches("[data-time-for]") && $("bossList").contains(activeElement);
 if(!isTypingBossTime){
  $("bossList").innerHTML=visibleList.map(b=>{
   const st=state(b);
   return '<div class="boss-row"><button class="boss-main" type="button" data-cut-now="'+esc(b.id)+'" '+(busy?'disabled':'')+'><span class="bossname">'+esc(b.name)+'</span><span class="time '+st.cls+'">'+esc(st.label)+'</span></button><div class="row-entry"><input type="search" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-form-type="other" maxlength="5" aria-label="'+esc(b.name)+' 컷 시간" data-time-for="'+esc(b.id)+'" value="'+esc(saved[b.id]||"")+'"><button class="primary" type="button" data-cut-time="'+esc(b.id)+'" '+(busy?'disabled':'')+'>등록</button></div></div>';
  }).join("")||'<div class="muted">검색 결과가 없습니다.</div>';
 }
 if(selectedPopupBossId!==null){const selected=bosses.find(x=>String(x.id)===String(selectedPopupBossId));if(selected){const st=state(selected);$("modalBossTime").textContent=st.label;$("modalBossTime").className="time "+st.cls;}}
}
async function loadData(){
 const [br,cr]=await Promise.all([
  db.from("bosses").select("*").or("is_active.is.null,is_active.eq.true").order("name"),
  db.from("cut_records").select("*").eq("server_id",serverId).order("cut_at",{ascending:false}).limit(150)
 ]);
 if(br.error)throw br.error;if(cr.error)throw cr.error;
 bosses=br.data||[];cuts=cr.data||[];
 $("status").textContent="접속 중 · "+(profile.nickname||"혈맹원")+" · "+serverId+"번 서버";
 render();
}
function parseTime(value){
 let v=String(value||"").trim(),h,m;
 if(/^\d{4}$/.test(v)){h=Number(v.slice(0,2));m=Number(v.slice(2));}
 else if(/^\d{1,2}:\d{2}$/.test(v)){[h,m]=v.split(":").map(Number);}
 else throw new Error("2135 또는 21:35 형식으로 입력하세요.");
 if(h<0||h>23||m<0||m>59)throw new Error("올바른 24시간 형식으로 입력하세요.");
 const d=new Date();const out=new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,m,0,0);if(out.getTime()>Date.now()+60000)out.setDate(out.getDate()-1);return out.toISOString();
}
async function registerCut(bossId,cutAt){
 const b=bosses.find(x=>String(x.id)===String(bossId));if(!b)throw new Error("보스를 찾을 수 없습니다.");
 if(busy)return;busy=true;render();say("컷 기록을 저장하고 있습니다...");
 try{
  const now=new Date().toISOString();
  const {data,error}=await db.from("cut_records").insert({boss_id:b.id,server_id:serverId,cut_at:cutAt,created_by:user.id,created_by_nickname:profile.nickname||"혈맹원",updated_at:now,updated_by:user.id}).select("id").single();
  if(error)throw error;if(!data?.id)throw new Error("등록된 기록 번호를 확인하지 못했습니다.");
  const {error:cancelError}=await db.from("cut_records").update({pending_delete_at:null}).eq("boss_id",b.id).eq("server_id",serverId).not("pending_delete_at","is",null);
  if(cancelError)throw cancelError;
  const {data:rows,error:rowsError}=await db.from("cut_records").select("id,cut_at,updated_at").eq("boss_id",b.id).eq("server_id",serverId).is("pending_delete_at",null).order("updated_at",{ascending:false});
  if(rowsError)throw rowsError;
  const old=(rows||[]).slice(3).map(x=>x.id);
  if(old.length){const deleteAt=new Date(Date.now()+600000).toISOString();const {error:pendingError}=await db.from("cut_records").update({pending_delete_at:deleteAt}).in("id",old).eq("server_id",serverId);if(pendingError)throw pendingError;}
  const rowInput=[...$("bossList").querySelectorAll("[data-time-for]")].find(x=>x.dataset.timeFor===String(bossId));if(rowInput)rowInput.value="";
  await loadData();if(selectedPopupBossId!==null&&String(selectedPopupBossId)===String(bossId))closeBossModal();say(b.name+" 컷 등록 완료");
 }catch(e){say("등록 실패: "+(e.message||e));}
 finally{busy=false;render();}
}
async function start(){
 const {data,error}=await db.auth.getSession();if(error)throw error;
 if(!data.session?.user){$("loginBox").style.display="block";return;}
 user=data.session.user;
 const {data:p,error:pe}=await db.from("profiles").select("*").eq("id",user.id).maybeSingle();if(pe)throw pe;if(!p)throw new Error("회원 프로필을 찾을 수 없습니다.");profile=p;
 if((profile.account_status||"active")!=="active")throw new Error("이 계정은 사용할 수 없습니다.");
 serverId=Number(profile.last_server_id)||1;
 $("app").style.display="block";await loadData();
 if(channel)db.removeChannel(channel);
 channel=db.channel("mini-boss-live-"+serverId).on("postgres_changes",{event:"*",schema:"public",table:"cut_records",filter:"server_id=eq."+serverId},async()=>{try{await loadData();}catch(e){say(e.message);}}).subscribe();
}
function openBossModal(bossId){const b=bosses.find(x=>String(x.id)===String(bossId));if(!b)return;selectedPopupBossId=b.id;$("modalBossTitle").textContent=b.name+" 컷 등록";$("modalBossName").textContent=b.name;$("modalBossInput").value="";const st=state(b);$("modalBossTime").textContent=st.label;$("modalBossTime").className="time "+st.cls;$("bossModal").classList.add("show");}
function closeBossModal(){ $("bossModal").classList.remove("show");selectedPopupBossId=null;$("modalBossInput").value="";}
$("closeBossModal").addEventListener("click",closeBossModal);
$("bossModal").addEventListener("click",e=>{if(e.target===$("bossModal"))closeBossModal();});
async function submitModalCut(){if(selectedPopupBossId===null)return;try{const id=selectedPopupBossId;const value=$("modalBossInput").value.trim();await registerCut(id,value?parseTime(value):new Date().toISOString());}catch(err){say(err.message);}}
$("modalBossRegister").addEventListener("click",submitModalCut);
$("modalBossInput").addEventListener("keydown",e=>{if(e.key==="Enter")submitModalCut();});
$("bossList").addEventListener("click",e=>{
 const nowBtn=e.target.closest("[data-cut-now]");
 if(nowBtn){openBossModal(nowBtn.dataset.cutNow);return; }
 const timeBtn=e.target.closest("[data-cut-time]");
 if(timeBtn){
  const id=timeBtn.dataset.cutTime;
  const input=[...$("bossList").querySelectorAll("[data-time-for]")].find(x=>x.dataset.timeFor===id);
  try{registerCut(id,parseTime(input?.value));}catch(err){say(err.message);}
 }
});
$("bossList").addEventListener("keydown",e=>{
 if(e.key!=="Enter"||!e.target.matches("[data-time-for]"))return;
 const id=e.target.dataset.timeFor;
 const btn=[...$("bossList").querySelectorAll("[data-cut-time]")].find(x=>x.dataset.cutTime===id);
 btn?.click();
});
$("search").addEventListener("input",render);
$("bossListToggle").addEventListener("click",()=>{showAllBosses=!showAllBosses;render();});

$("goMainBtn").addEventListener("click",()=>{
 // 미니창을 연 기존 보탐봇 탭으로 돌아갑니다.
 try{
  if(window.opener && !window.opener.closed){
   window.opener.focus();
   window.close();
   return;
  }
 }catch(e){}
 // 독립 실행 등 원래 창을 찾을 수 없으면 현재 창에서 메인 화면을 엽니다.
 location.href="./";
});
$("refreshBtn").addEventListener("click",async()=>{try{await loadData();say("갱신 완료");}catch(e){say("갱신 실패: "+e.message);}});
$("openMainBtn").addEventListener("click",()=>location.href="./");
db.auth.onAuthStateChange((event)=>{if(event==="SIGNED_OUT"){user=null;$("app").style.display="none";$("loginBox").style.display="block";}});
setInterval(()=>{if(user)render();},1000);
setInterval(async()=>{if(user){try{await loadData();}catch(e){console.warn(e);}}},15000);
start().catch(e=>{console.error(e);say("초기화 실패: "+e.message);$("loginBox").style.display="block";});
</script>
</body>
</html>
